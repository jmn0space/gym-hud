# Standalone production file; do not merge with the local docker-compose.yml.
services:
  web:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the Neon pooled DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a strong DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set public DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set HTTPS trusted origins}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DJANGO_SESSION_COOKIE_AGE: ${DJANGO_SESSION_COOKIE_AGE:-2592000}
      DJANGO_LOGIN_THROTTLE_RATE: ${DJANGO_LOGIN_THROTTLE_RATE:-10/min}
      DJANGO_SYNC_THROTTLE_RATE: ${DJANGO_SYNC_THROTTLE_RATE:-120/min}
    expose:
      - "8000"
    restart: unless-stopped
