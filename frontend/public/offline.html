<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />
    <title>Gym HUD is offline</title>
    <!--
      Last-resort fallback only. The service worker serves the precached app shell
      for navigations; this page is reached solely when that shell is genuinely
      missing from the cache. It must therefore render with zero network: inline
      CSS, no bundle, no fonts, no images.
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, Roboto, "Segoe UI", sans-serif;
        font-size: 112.5%;
        line-height: 1.45;
      }
      body {
        display: grid;
        place-content: center;
        gap: 0.75rem;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        background: #0b0d10;
        color: #f2f5f8;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.2;
      }
      p {
        max-width: 26rem;
        margin: 0;
        color: #aab5c1;
      }
      .mark {
        width: 3rem;
        height: 0.6rem;
        margin: 0 auto 0.5rem;
        border-radius: 0.3rem;
        background: #ffb020;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"></div>
      <h1>Gym HUD is offline</h1>
      <p>
        The app shell is not on this device yet. Reconnect once and open Gym HUD again — after that
        it starts and runs without a network connection.
      </p>
    </main>
  </body>
</html>
