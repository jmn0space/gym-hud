name: Gym HUD CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gymhud_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gymhud_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymhud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gymhud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ scripts/ tests/
          ruff format --check backend/ scripts/ tests/

      - name: Type check with Mypy
        run: mypy backend/

      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            rm -f pip-audit.json
            audit_exit=0
            pip-audit \
              -r requirements.txt \
              --format json --aliases \
              --output pip-audit.json || audit_exit=$?

            if [ "$audit_exit" -le 1 ] && [ -s pip-audit.json ]; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pip-audit failed after 3 attempts (last exit: $audit_exit)." >&2
              exit 2
            fi

            echo "pip-audit failed; retrying attempt $((attempt + 1))/3..." >&2
            sleep $((attempt * 2))
          done
          python scripts/enforce_pip_audit_severity.py pip-audit.json

      - name: Run Django system checks
        run: python backend/manage.py check --settings=config.settings.test

      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # The Vite dev server is a dev dependency but may be exposed on the LAN.
      - name: Audit development dependencies
        run: npm audit --audit-level=critical

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Issue #23's acceptance criterion 1 asks for evidence tied to one
      # identified build; this ties the run's own log to the commit it built
      # and tested (the shell cache name attached by smoke.spec.ts ties the
      # browser-side evidence to the same build).
      - name: Record the commit under test
        run: echo "Validating commit $GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Keyed on the lockfile's hash rather than a written-out version number, so
      # bumping @playwright/test invalidates this without anyone remembering to
      # edit the key -- a stale browser binary against a newer Playwright is a
      # confusing failure to debug. A cache hit still needs `--with-deps` below
      # to run: that step installs the OS-level system dependencies the cached
      # binary needs, and those are never part of this cache.
      - name: Cache Playwright browser binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
