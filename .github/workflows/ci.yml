name: Gym HUD CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ scripts/
          ruff format --check backend/ scripts/

      - name: Type check with Mypy
        run: mypy backend/

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --format cyclonedx-json --output pip-audit.json || true
          python scripts/enforce_pip_audit_severity.py pip-audit.json

      - name: Run Django system checks
        run: python backend/manage.py check --settings=config.settings.test

      - name: Run tests
        run: pytest backend/
