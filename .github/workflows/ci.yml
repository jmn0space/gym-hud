name: Gym HUD CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gymhud_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gymhud_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymhud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gymhud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check backend/ scripts/
          ruff format --check backend/ scripts/

      - name: Type check with Mypy
        run: mypy backend/

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --format cyclonedx-json --output pip-audit.json || true
          python scripts/enforce_pip_audit_severity.py pip-audit.json

      - name: Run Django system checks
        run: python backend/manage.py check --settings=config.settings.test

      - name: Run tests
        run: pytest backend/
